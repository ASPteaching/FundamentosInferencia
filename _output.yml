bookdown::bs4_book:
  css:
    - blocks.css
    - bs4-style.css
  footnotes_inline: false
  split_bib: true
  includes:
    before_body: profiles/bs4-downloads.html

bookdown::gitbook:
  css: blocks.css
  config:
    toc:
      collapse: section
      scroll_highlight: true
      before: |
        <div style="margin:0 0 10px 15px;">
          <a href="FundamentosInferencia.pdf" target="_blank"
             title="Descargar PDF"
             style="display:flex;align-items:center;gap:6px;text-decoration:none;">
            <img src="images/aPDF.png" alt="PDF" width="16" height="20">
            <span style="font-weight:bold;">Teoría (PDF)</span>
          </a>
          <a href="FundamentosInferencia-Ejercicios.pdf" target="_blank">Ejercicios (PDF)</a>
        </div>

bookdown::pdf_book:
  keep_tex: yes
